name: Pruebas de carga JMeter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      threads:
        description: "Usuarios concurrentes (1-25)"
        required: false
        default: 5
        type: number
      ramp_up:
        description: "Segundos de ramp-up (1-120)"
        required: false
        default: 5
        type: number
      loops:
        description: "Iteraciones por usuario (1-10)"
        required: false
        default: 2
        type: number

permissions:
  contents: read

jobs:
  jmeter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_PORT: 3001
      JMETER_THREADS: ${{ github.event.inputs.threads || '5' }}
      JMETER_RAMP_UP: ${{ github.event.inputs.ramp_up || '5' }}
      JMETER_LOOPS: ${{ github.event.inputs.loops || '2' }}
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de la aplicacion
        run: npm ci

      - name: Descargar y verificar Apache JMeter
        run: |
          curl --fail --silent --show-error --location \
            https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz \
            --output "$RUNNER_TEMP/apache-jmeter-5.6.3.tgz"
          echo "5978a1a35edb5a7d428e270564ff49d2b1b257a65e17a759d259a9283fc17093e522fe46f474a043864aea6910683486340706d745fcdf3db1505fd71e689083  $RUNNER_TEMP/apache-jmeter-5.6.3.tgz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/apache-jmeter-5.6.3.tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/apache-jmeter-5.6.3/bin/jmeter" --version

      - name: Levantar servidor local
        run: |
          node backend/servidor.js > server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/api/salud > /dev/null; then
              echo "Servidor disponible"
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Ejecutar prueba de carga
        run: |
          if ! [[ "$JMETER_THREADS" =~ ^[0-9]+$ ]] ||
             ! [[ "$JMETER_RAMP_UP" =~ ^[0-9]+$ ]] ||
             ! [[ "$JMETER_LOOPS" =~ ^[0-9]+$ ]]; then
            echo "Los parametros deben ser numeros enteros."
            exit 1
          fi
          if (( JMETER_THREADS < 1 || JMETER_THREADS > 25 ||
                JMETER_RAMP_UP < 1 || JMETER_RAMP_UP > 120 ||
                JMETER_LOOPS < 1 || JMETER_LOOPS > 10 )); then
            echo "Limites permitidos: threads 1-25, ramp_up 1-120, loops 1-10."
            exit 1
          fi
          mkdir -p jmeter/results
          "$RUNNER_TEMP/apache-jmeter-5.6.3/bin/jmeter" \
            -n \
            -t jmeter/tc10-load-test.jmx \
            -Jhost=127.0.0.1 \
            -Jport=3001 \
            -Jthreads="$JMETER_THREADS" \
            -JrampUp="$JMETER_RAMP_UP" \
            -Jloops="$JMETER_LOOPS" \
            -l jmeter/results/results.jtl \
            -j jmeter/results/jmeter.log \
            -e \
            -o jmeter/results/html
          python - <<'PY'
          import csv
          import sys

          with open("jmeter/results/results.jtl", newline="", encoding="utf-8") as results:
              failures = [row for row in csv.DictReader(results) if row.get("success", "").lower() != "true"]

          if failures:
              print(f"Fallaron {len(failures)} muestras JMeter:")
              for failure in failures[:10]:
                  print(f"- {failure.get('label')}: HTTP {failure.get('responseCode')} {failure.get('failureMessage', '')}")
              sys.exit(1)

          print("Todas las muestras JMeter pasaron las aserciones.")
          PY

      - name: Guardar reporte JMeter y logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jmeter
          path: |
            jmeter/results/
            server.log
          if-no-files-found: warn
