name: Auditoria de accesibilidad WAVE

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL HTTPS publica a auditar (vacia para usar WAVE_TARGET_URL)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  wave:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WAVE_API_KEY: ${{ secrets.WAVE_API_KEY }}
      WAVE_URL: ${{ github.event.inputs.url || vars.WAVE_TARGET_URL }}
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Auditar con WAVE API
        run: |
          mkdir -p wave-results
          python - <<'PY'
          import json
          import os
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode, urlsplit
          from urllib.request import urlopen

          target = os.environ.get("WAVE_URL", "").strip()
          api_key = os.environ.get("WAVE_API_KEY", "").strip()
          report_path = "wave-results/report.json"

          if not api_key:
              sys.exit("Falta el secret WAVE_API_KEY. Configuralo en Settings > Secrets and variables > Actions.")
          if not target:
              sys.exit("Falta la URL publica: configura la variable WAVE_TARGET_URL o indica url al ejecutar manualmente.")

          parsed = urlsplit(target)
          if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
              sys.exit("La URL de WAVE debe ser HTTPS publica y no incluir credenciales.")
          if parsed.hostname.lower() in {"localhost", "127.0.0.1", "::1"}:
              sys.exit("WAVE es un analizador remoto y no puede acceder a localhost. Usa una URL publicada.")

          query = urlencode({"key": api_key, "url": target, "reporttype": "2"})
          request_url = f"https://wave.webaim.org/api/request?{query}"
          try:
              with urlopen(request_url, timeout=120) as response:
                  report = json.load(response)
          except (HTTPError, URLError, TimeoutError, json.JSONDecodeError) as error:
              sys.exit(f"No se pudo completar la solicitud a WAVE API: {type(error).__name__}")

          with open(report_path, "w", encoding="utf-8") as output:
              json.dump(report, output, ensure_ascii=False, indent=2)

          status = report.get("status", {})
          if not status.get("success"):
              sys.exit("WAVE API rechazo la auditoria. Revisa la clave, los creditos y la URL.")

          statistics = report.get("statistics", {})
          try:
              site_status = int(status.get("httpstatuscode", 0))
          except (TypeError, ValueError):
              site_status = 0
          if not 200 <= site_status < 400:
              sys.exit(f"WAVE no pudo analizar la pagina correctamente (HTTP {site_status}).")

          categories = report.get("categories", {})
          counts = {
              name: int(categories.get(name, {}).get("count", 0))
              for name in ("error", "contrast", "alert", "feature", "structure", "aria")
          }
          title = statistics.get("pagetitle") or target
          print(f"WAVE audito: {title}")
          print(f"URL evaluada: {statistics.get('pageurl', target)}")
          print(f"Hallazgos: errores={counts['error']}, contraste={counts['contrast']}, alertas={counts['alert']}")
          print(f"Elementos: features={counts['feature']}, estructura={counts['structure']}, ARIA={counts['aria']}")
          print("El reporte se guarda como artefacto wave-accessibility-report.")
          PY

      - name: Guardar reporte WAVE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-accessibility-report
          path: wave-results/
          if-no-files-found: warn
