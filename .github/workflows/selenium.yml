name: Pruebas automatizadas Selenium

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selenium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_PORT: 3001
      SELENIUM_HEADLESS: "1"
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Configurar Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Verificar y seleccionar Chrome y ChromeDriver
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          test -x "$CHROME_PATH" || { echo "::error::No se encontro el binario de Chrome instalado por el workflow."; exit 1; }
          test -x "$CHROMEDRIVER_PATH" || { echo "::error::No se encontro el ChromeDriver instalado por el workflow."; exit 1; }
          chrome_major="$("$CHROME_PATH" --version | sed -E 's/.* ([0-9]+)\..*/\1/')"
          driver_major="$("$CHROMEDRIVER_PATH" --version | sed -E 's/.* ([0-9]+)\..*/\1/')"
          echo "Chrome major: $chrome_major"
          echo "ChromeDriver major: $driver_major"
          if [ "$chrome_major" != "$driver_major" ]; then
            echo "::error::Chrome y ChromeDriver deben tener la misma version principal."
            exit 1
          fi
          echo "SELENIUM_CHROME_BINARY=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "SELENIUM_CHROMEDRIVER=$CHROMEDRIVER_PATH" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: |
          npm ci
          python -m pip install -r requirements.txt

      - name: Levantar servidor local
        run: |
          node backend/servidor.js > server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/api/salud > /dev/null; then
              echo "Servidor disponible"
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Ejecutar casos Selenium
        run: |
          mkdir -p capturas_evidencia
          python -m pytest -q --junitxml=capturas_evidencia/reporte_selenium.xml

      - name: Guardar reportes y evidencias
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: evidencias-selenium
          path: |
            capturas_evidencia/
            server.log
          if-no-files-found: warn
