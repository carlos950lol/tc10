<div class="modal-overlay" id="modal-new-task">
  <div class="modal">
    <div class="modal-header"><h2><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Nueva tarea</h2><button class="modal-close" onclick="closeModal('modal-new-task')"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="form-group"><label class="form-label">Titulo</label><input type="text" class="form-input" placeholder="Ej: Ejercicios capitulo 5"></div>
    <div class="form-group"><label class="form-label">Tipo</label><select class="form-input"><option>Tarea</option><option>Examen</option><option>Proyecto</option><option>Exposicion</option></select></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group"><label class="form-label">Grupo</label><select class="form-input" id="task-group-sel"><option value="">Seleccionar...</option></select></div>
      <div class="form-group"><label class="form-label">Fecha limite</label><input type="date" class="form-input"></div>
    </div>
    <div class="form-group"><label class="form-label">Instrucciones</label><textarea class="form-input" rows="3" style="resize:vertical" placeholder="Descripcion para los alumnos..."></textarea></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
      <button class="btn" onclick="closeModal('modal-new-task')">Cancelar</button>
      <button class="btn btn-primary"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Publicar</button>
    </div>
  </div>
</div>
