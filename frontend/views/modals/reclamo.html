<div class="modal-overlay" id="modal-new-reclamo">
  <div class="modal" style="max-width:480px">
    <div class="modal-header"><h3>Nuevo Reclamo</h3><button class="modal-close" onclick="closeModal('modal-new-reclamo')"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Asunto del reclamo *</label><input type="text" class="form-input" id="rec-asunto" placeholder="Ej: Calificación incorrecta en Matemáticas"></div>
      <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group" style="margin:0"><label class="form-label">Tipo</label>
          <select class="form-input" id="rec-tipo">
            <option value="calificacion">Calificación</option>
            <option value="asistencia">Asistencia</option>
            <option value="trato">Trato/Conducta</option>
            <option value="administrativo">Administrativo</option>
            <option value="otro">Otro</option>
          </select>
        </div>
        <div class="form-group" style="margin:0"><label class="form-label">Prioridad</label>
          <select class="form-input" id="rec-prioridad">
            <option value="normal">Normal</option>
            <option value="alta">Alta</option>
            <option value="urgente">Urgente</option>
          </select>
        </div>
      </div>
      <div class="form-group" style="margin:0"><label class="form-label">Descripción *</label><textarea class="form-input" id="rec-desc" rows="4" placeholder="Describe detalladamente tu reclamo..." style="resize:vertical"></textarea></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--border)">
      <button class="btn" onclick="closeModal('modal-new-reclamo')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveReclamo()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/></svg>
        Enviar reclamo
      </button>
    </div>
  </div>
</div>
