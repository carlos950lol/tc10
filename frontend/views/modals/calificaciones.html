<div class="modal-overlay" id="modal-add-grade-student">
  <div class="modal" style="width:520px">
    <div class="modal-header">
      <h2><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;vertical-align:-3px"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>Registrar alumno y notas</h2>
      <button class="modal-close" onclick="closeModal('modal-add-grade-student')"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <!-- Datos del alumno -->
    <div style="background:var(--cream);border-radius:var(--r);padding:14px 16px;margin-bottom:16px">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:12px">Datos del alumno</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="form-group" style="margin:0"><label class="form-label">Nombre completo</label><input type="text" class="form-input" id="ag-name" placeholder="Ej: Juan Perez"></div>
        <div class="form-group" style="margin:0"><label class="form-label">Grupo</label>
          <select class="form-input" id="ag-group"><option value="">Seleccionar...</option></select>
        </div>
      </div>
    </div>
    <!-- Calificaciones -->
    <div style="background:var(--cream);border-radius:var(--r);padding:14px 16px;margin-bottom:16px">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:12px">Calificaciones (0 – 20)</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="form-group" style="margin:0">
          <label class="form-label">Examen 1</label>
          <input type="number" class="form-input" id="ag-e1" placeholder="—" min="0" max="20" step="0.5" oninput="previewAvg()">
        </div>
        <div class="form-group" style="margin:0">
          <label class="form-label">Examen 2</label>
          <input type="number" class="form-input" id="ag-e2" placeholder="—" min="0" max="20" step="0.5" oninput="previewAvg()">
        </div>
        <div class="form-group" style="margin:0">
          <label class="form-label">Tareas</label>
          <input type="number" class="form-input" id="ag-tarea" placeholder="—" min="0" max="20" step="0.5" oninput="previewAvg()">
        </div>
        <div class="form-group" style="margin:0">
          <label class="form-label">Proyecto</label>
          <input type="number" class="form-input" id="ag-proyecto" placeholder="—" min="0" max="20" step="0.5" oninput="previewAvg()">
        </div>
      </div>
    </div>
    <!-- Preview promedio -->
    <div id="ag-preview" style="display:none;background:var(--accent-light);border:1px solid rgba(79,70,229,.2);border-radius:var(--r);padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:13px;color:var(--accent);font-weight:500">Promedio calculado</span>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:22px;font-weight:700;color:var(--navy)" id="ag-avg-val">—</span>
        <span class="badge" id="ag-avg-badge">—</span>
      </div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn" onclick="closeModal('modal-add-grade-student')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveGradeStudent()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Guardar registro
      </button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-edit-grade">
  <div class="modal" style="width:500px">
    <div class="modal-header">
      <h2><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;vertical-align:-3px"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>Modificar notas</h2>
      <button class="modal-close" onclick="closeModal('modal-edit-grade')"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div style="background:var(--cream);border-radius:var(--r);padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px">
      <div id="eg-avatar" style="width:38px;height:38px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent);flex-shrink:0"></div>
      <div>
        <div id="eg-name" style="font-size:14px;font-weight:600;color:var(--navy)"></div>
        <div id="eg-group" style="font-size:12px;color:var(--muted)"></div>
      </div>
    </div>
    <div style="background:var(--cream);border-radius:var(--r);padding:14px 16px;margin-bottom:16px">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:12px">Calificaciones (0 – 20)</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="form-group" style="margin:0"><label class="form-label">Examen 1</label><input type="number" class="form-input" id="eg-e1" min="0" max="20" step="0.5" oninput="previewEditAvg()"></div>
        <div class="form-group" style="margin:0"><label class="form-label">Examen 2</label><input type="number" class="form-input" id="eg-e2" min="0" max="20" step="0.5" oninput="previewEditAvg()"></div>
        <div class="form-group" style="margin:0"><label class="form-label">Tareas</label><input type="number" class="form-input" id="eg-tarea" min="0" max="20" step="0.5" oninput="previewEditAvg()"></div>
        <div class="form-group" style="margin:0"><label class="form-label">Proyecto</label><input type="number" class="form-input" id="eg-proyecto" min="0" max="20" step="0.5" oninput="previewEditAvg()"></div>
      </div>
    </div>
    <div id="eg-preview" style="background:var(--accent-light);border:1px solid rgba(79,70,229,.2);border-radius:var(--r);padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:13px;color:var(--accent);font-weight:500">Promedio calculado</span>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:22px;font-weight:700;color:var(--navy)" id="eg-avg-val">—</span>
        <span class="badge b-gray" id="eg-avg-badge">—</span>
      </div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn" onclick="closeModal('modal-edit-grade')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveEditGrade()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Guardar cambios
      </button>
    </div>
  </div>
</div>
