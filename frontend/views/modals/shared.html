<div id="modal-logout" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9998;align-items:center;justify-content:center">
  <div style="background:var(--white);border-radius:18px;padding:28px 32px;width:360px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.2);text-align:center">
    <div style="width:52px;height:52px;border-radius:50%;background:var(--danger-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
      <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </div>
    <div style="font-family:var(--fd);font-size:18px;font-weight:700;color:var(--navy);margin-bottom:8px">Cerrar sesion</div>
    <div style="font-size:13.5px;color:var(--muted);margin-bottom:24px;line-height:1.55">Seguro que deseas salir de tu cuenta? Tendras que volver a iniciar sesion para acceder.</div>
    <div style="display:flex;gap:10px">
      <button onclick="cancelLogout()" style="flex:1;padding:11px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--white);font-family:var(--font);font-size:14px;font-weight:600;color:var(--slate);cursor:pointer;transition:all .15s">No, quedarme</button>
      <button onclick="confirmLogout()" style="flex:1;padding:11px;border:none;border-radius:var(--r);background:var(--danger);font-family:var(--font);font-size:14px;font-weight:600;color:#fff;cursor:pointer;transition:all .15s">Si, salir</button>
    </div>
  </div>
</div>
