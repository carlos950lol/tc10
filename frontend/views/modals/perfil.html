<div class="modal-overlay" id="modal-edit-profile">
  <div class="modal">
    <div class="modal-header"><h2><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Editar perfil</h2><button class="modal-close" onclick="closeModal('modal-edit-profile')"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="form-group"><label class="form-label">Nombre completo</label><input type="text" class="form-input" id="edit-name"></div>
    <div class="form-group"><label class="form-label">Correo</label><input type="email" class="form-input" id="edit-email"></div>
    <div class="form-group"><label class="form-label">Telefono</label><input type="tel" class="form-input" id="edit-phone" placeholder="55 0000 0000"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" onclick="closeModal('modal-edit-profile')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveProfile()"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Guardar</button>
    </div>
  </div>
</div>
