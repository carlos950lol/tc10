<div class="modal-overlay" id="modal-new-registro">
  <div class="modal" style="max-width:480px">
    <div class="modal-header"><h3>Nuevo Registro</h3><button class="modal-close" onclick="closeModal('modal-new-registro')"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="form-group" style="margin:0"><label class="form-label">Nombres *</label><input type="text" class="form-input" id="reg-nombres" placeholder="Nombres"></div>
        <div class="form-group" style="margin:0"><label class="form-label">Apellidos *</label><input type="text" class="form-input" id="reg-apellidos" placeholder="Apellidos"></div>
      </div>
      <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group" style="margin:0"><label class="form-label">Tipo</label>
          <select class="form-input" id="reg-tipo">
            <option value="alumno">Alumno</option>
            <option value="docente">Docente</option>
            <option value="administrativo">Administrativo</option>
          </select>
        </div>
        <div class="form-group" style="margin:0"><label class="form-label">DNI</label>
          <input type="text" class="form-input" id="reg-dni" placeholder="00000000" maxlength="8">
        </div>
      </div>
      <div class="form-group"><label class="form-label">Correo institucional</label><input type="email" class="form-input" id="reg-email" placeholder="nombre@acadecam.edu.pe"></div>
      <div class="form-group" style="margin:0"><label class="form-label">Teléfono / Contacto</label><input type="text" class="form-input" id="reg-tel" placeholder="+51 999 999 999"></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--border)">
      <button class="btn" onclick="closeModal('modal-new-registro')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveRegistro()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Guardar registro
      </button>
    </div>
  </div>
</div>
