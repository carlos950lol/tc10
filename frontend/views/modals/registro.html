<div class="modal-overlay" id="modal-new-registro">
  <div class="modal" style="max-width:480px">
    <div class="modal-header"><h2>Nuevo Registro</h2><button type="button" class="modal-close" aria-label="Cerrar ventana" onclick="closeModal('modal-new-registro')"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="form-group" style="margin:0"><label class="form-label" for="reg-nombres">Nombres *</label><input type="text" class="form-input" id="reg-nombres" placeholder="Nombres"></div>
        <div class="form-group" style="margin:0"><label class="form-label" for="reg-apellidos">Apellidos *</label><input type="text" class="form-input" id="reg-apellidos" placeholder="Apellidos"></div>
      </div>
      <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group" style="margin:0"><label class="form-label" for="reg-tipo">Tipo</label>
          <select class="form-input" id="reg-tipo" onchange="toggleLegacyRegistrationFields()">
            <option value="alumno">Alumno</option>
            <option value="docente">Docente</option>
            <option value="registrador">Registrador</option>
          </select>
        </div>
        <div class="form-group" style="margin:0"><label class="form-label" for="reg-dni">DNI</label>
          <input type="text" class="form-input" id="reg-dni" placeholder="00000000" maxlength="8">
        </div>
      </div>
      <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group" style="margin:0"><label class="form-label" for="reg-fechanac">Fecha de nacimiento</label><input type="date" class="form-input" id="reg-fechanac"></div>
        <div class="form-group" style="margin:0"><label class="form-label" for="reg-apo-dni">DNI del apoderado</label><input type="text" inputmode="numeric" pattern="[0-9]{8}" class="form-input" id="reg-apo-dni" maxlength="8"></div>
      </div>
      <div id="reg-school-placement" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
        <div class="form-group" style="margin:0"><label class="form-label" for="reg-nivel">Nivel *</label><select class="form-input" id="reg-nivel" onchange="updateGradoOptions('reg-nivel','reg-grado')"><option value="">Seleccionar...</option><option value="primaria">Primaria</option><option value="secundaria">Secundaria</option></select></div>
        <div class="form-group" style="margin:0"><label class="form-label" for="reg-grado">Grado *</label><select class="form-input" id="reg-grado" disabled><option value="">Selecciona nivel</option></select></div>
        <div class="form-group" style="margin:0"><label class="form-label" for="reg-seccion">Sección *</label><select class="form-input" id="reg-seccion"><option value="">Seleccionar...</option><option>A</option><option>B</option><option>C</option></select></div>
      </div>
      <div class="form-group" id="reg-email-wrap"><label class="form-label" for="reg-email">Correo institucional</label><input type="email" class="form-input" id="reg-email" placeholder="nombre@acadecam.edu.pe"></div>
      <small id="reg-personal-email-note" class="page-sub" style="display:none">El correo del personal se generará con su nombre completo y el dominio @acadecam.edu.pe. Si ya está registrado, no se permitirá el alta.</small>
      <div class="form-group" style="margin:0"><label class="form-label" for="reg-tel">Teléfono / Contacto</label><input type="text" inputmode="numeric" pattern="[0-9]{9}" class="form-input" id="reg-tel" maxlength="9" placeholder="999999999"></div>
      <div class="form-group"><label class="form-label" for="reg-apoderado">Nombres y apellidos del apoderado</label><input type="text" class="form-input" id="reg-apoderado"></div>
      <div class="form-group"><label class="form-label" for="reg-apo-tel">Teléfono del apoderado</label><input type="text" inputmode="numeric" pattern="[0-9]{9}" class="form-input" id="reg-apo-tel" maxlength="9" placeholder="999999999"></div>
      <p id="reg-error" role="alert" hidden style="margin:0;color:#b91c1c;font-size:12px"></p>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--border)">
      <button class="btn" onclick="closeModal('modal-new-registro')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveRegistro()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Guardar registro
      </button>
    </div>
  </div>
</div>
