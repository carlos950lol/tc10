<div class="modal-overlay" id="modal-new-matricula">
  <div class="modal" style="max-width:500px">
    <div class="modal-header"><h3>Nueva Matrícula</h3><button class="modal-close" onclick="closeModal('modal-new-matricula')"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="form-group" style="margin:0"><label class="form-label">Nombres *</label><input type="text" class="form-input" id="mat-nombres" placeholder="Nombres"></div>
        <div class="form-group" style="margin:0"><label class="form-label">Apellidos *</label><input type="text" class="form-input" id="mat-apellidos" placeholder="Apellidos"></div>
      </div>
      <div class="form-group"><label class="form-label">DNI</label><input type="text" class="form-input" id="mat-dni" placeholder="00000000" maxlength="8"></div>
      <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group" style="margin:0"><label class="form-label">Sección *</label>
          <select class="form-input" id="mat-seccion">
            <option value="">Seleccionar...</option>
            <option value="6-A">6-A</option>
            <option value="6-B">6-B</option>
            <option value="5-A">5-A</option>
            <option value="5-B">5-B</option>
            <option value="4-A">4-A</option>
          </select>
        </div>
        <div class="form-group" style="margin:0"><label class="form-label">Año lectivo</label>
          <input type="text" class="form-input" id="mat-anio" value="2025" placeholder="2025">
        </div>
      </div>
      <div class="form-group"><label class="form-label">Apoderado</label><input type="text" class="form-input" id="mat-apoderado" placeholder="Nombre del apoderado"></div>
      <div class="form-group" style="margin:0"><label class="form-label">Observaciones</label><textarea class="form-input" id="mat-obs" rows="2" placeholder="Notas adicionales..." style="resize:vertical"></textarea></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--border)">
      <button class="btn" onclick="closeModal('modal-new-matricula')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveMatricula()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Registrar matrícula
      </button>
    </div>
  </div>
</div>
