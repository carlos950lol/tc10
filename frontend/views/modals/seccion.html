<div class="modal-overlay" id="modal-edit-seccion">
  <div class="modal" style="max-width:400px">
    <div class="modal-header"><h3>Editar Sección</h3><button class="modal-close" onclick="closeModal('modal-edit-seccion')"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Aula</label><input type="text" class="form-input" id="edit-sec-aula" placeholder="Ej: Aula 201"></div>
      <div class="form-group"><label class="form-label">Turno</label>
        <select class="form-input" id="edit-sec-turno">
          <option value="Mañana">Mañana</option>
          <option value="Tarde">Tarde</option>
          <option value="Noche">Noche</option>
        </select>
      </div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--border)">
      <button class="btn" onclick="closeModal('modal-edit-seccion')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveSeccionEdit()">Guardar</button>
    </div>
  </div>
</div>
