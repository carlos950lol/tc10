<div class="page" id="page-asistencia">
      <div class="topbar">
        <div><div class="page-title" id="att-pg-title"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>Asistencia</div><div class="page-sub" id="att-pg-sub"></div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn teacher-only" onclick="markAll('P')"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Todos presentes</button>
          <button class="btn btn-primary teacher-only"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Guardar</button>
        </div>
      </div>
      <div class="filter-bar teacher-only">
        <input type="date" class="filter-select" id="att-date" style="width:155px">
        <select class="filter-select" id="att-group-filter" onchange="loadAttGroup()"><option value="">Seleccionar grupo</option></select>
      </div>
      <div id="att-teacher-view">
        <div class="card">
          <div class="card-header"><h2 id="att-card-title"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><polyline points="3 6 4 7 6 5"/><polyline points="3 12 4 13 6 11"/><polyline points="3 18 4 19 6 17"/></svg>Lista de asistencia</h2></div>
          <div class="table-wrap">
            <table><thead><tr><th>#</th><th>Alumno</th><th>Asistencia</th><th>% del mes</th><th>Faltas</th><th>Estado</th></tr></thead>
            <tbody id="att-tbody"><tr><td colspan="6"><div class="empty-state"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><h3>Selecciona un grupo</h3><p>Elige el grupo para registrar asistencia.</p></div></td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
      <div id="att-student-view" style="display:none">
        <div class="stat-grid" id="att-student-stats" style="grid-template-columns:repeat(4,1fr);margin-bottom:18px"></div>
        <div class="card">
          <div class="card-header"><h2 id="att-cal-title"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Calendario de asistencia</h2></div>
          <div class="card-pad">
            <div class="att-grid" id="att-calendar"></div>
            <div class="att-legend" style="margin-top:12px">
              <div class="att-leg"><div class="att-dot" style="background:var(--success-bg)"></div> Presente</div>
              <div class="att-leg"><div class="att-dot" style="background:var(--danger-bg)"></div> Falta</div>
              <div class="att-leg"><div class="att-dot" style="background:var(--warning-bg)"></div> Tarde</div>
              <div class="att-leg"><div class="att-dot" style="background:var(--cream)"></div> No escolar</div>
            </div>
          </div>
        </div>
      </div>
    </div>
