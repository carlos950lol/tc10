<div class="page" id="page-seccion">
  <div class="topbar">
    <div>
      <div class="page-title" id="seccion-pg-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Mi Sección
      </div>
      <div class="page-sub" id="seccion-pg-sub">Información de tu grupo y aula</div>
    </div>
    <button class="btn btn-primary teacher-only" onclick="openModal('modal-edit-seccion')">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Editar sección
    </button>
  </div>
  <div class="two-col">
    <div>
      <div class="card">
        <div class="card-header">
          <h2><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg> Datos de la sección</h2>
        </div>
        <div class="card-pad" id="seccion-info">
          <div style="display:grid;gap:14px">
            <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
              <span style="font-size:13px;color:var(--muted)">Grado y sección</span>
              <span style="font-size:13px;font-weight:600;color:var(--navy)" id="sec-grado">6-A</span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
              <span style="font-size:13px;color:var(--muted)">Tutor / Docente</span>
              <span style="font-size:13px;font-weight:600;color:var(--navy)" id="sec-tutor">Profesor Demo</span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
              <span style="font-size:13px;color:var(--muted)">Aula</span>
              <span style="font-size:13px;font-weight:600;color:var(--navy)" id="sec-aula">Aula 201</span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
              <span style="font-size:13px;color:var(--muted)">Turno</span>
              <span style="font-size:13px;font-weight:600;color:var(--navy)" id="sec-turno">Mañana</span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0">
              <span style="font-size:13px;color:var(--muted)">Total alumnos</span>
              <span style="font-size:13px;font-weight:600;color:var(--navy)" id="sec-total">—</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div>
      <div class="card">
        <div class="card-header">
          <h2><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Alumnos de la sección</h2>
        </div>
        <div class="card-pad" id="seccion-alumnos-list">
          <div class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <p>No hay alumnos registrados en esta sección aún.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
