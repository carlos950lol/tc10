<div class="page" id="page-alumnos">
      <div class="topbar">
        <div><div class="page-title"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Mis Alumnos</div><div class="page-sub">Directorio y seguimiento</div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          
          <button class="btn btn-primary" onclick="openModal('modal-new-student')"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg> Agregar alumno</button>
        </div>
      </div>
      <div class="filter-bar">
        <div class="search-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input class="search-input" type="text" placeholder="Buscar alumno..." oninput="filterStudents(this.value)"></div>
        <select class="filter-select" id="students-group-filter" onchange="filterStudents('')"><option value="">Todos los grupos</option></select>
        <select class="filter-select" id="students-status-filter" onchange="filterStudents('')">
          <option value="">Todos</option><option>Excelente</option><option>Bien</option><option>Regular</option><option value="En riesgo">En riesgo</option>
        </select>
      </div>
      <div class="card">
        <div class="card-header"><h2><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20"/><circle cx="12" cy="10" r="2"/><path d="M9 16c0-1.7 1.3-3 3-3s3 1.3 3 3"/></svg>Directorio</h2><span id="students-count" style="font-size:12px;color:var(--muted)"></span></div>
        <div class="table-wrap">
          <table><thead><tr><th>#</th><th>Alumno</th><th>Grupo</th><th>Promedio</th><th>Asistencia</th><th>Tareas</th><th>Estado</th><th>Tutor</th></tr></thead>
          <tbody id="students-tbody"><tr><td colspan="8"><div class="empty-state"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><h3>Sin alumnos registrados</h3><p>Agrega alumnos para comenzar.</p></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
