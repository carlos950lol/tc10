<div class="page" id="page-reclamo">
  <div class="topbar">
    <div>
      <div class="page-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="12" y1="7" x2="12" y2="13"/></svg>
        Reclamos
      </div>
      <div class="page-sub" id="reclamo-pg-sub">Gestión de reclamos académicos</div>
    </div>
    <button class="btn btn-primary" onclick="openModal('modal-new-reclamo')">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span id="reclamo-btn-text">Nuevo reclamo</span>
    </button>
  </div>
  <div class="card">
    <div class="card-header">
      <h2><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg> Lista de reclamos</h2>
      <div style="display:flex;gap:8px">
        <select class="form-input" style="width:auto;padding:6px 10px;font-size:12px" id="reclamo-filter" onchange="filterReclamos()">
          <option value="all">Todos</option>
          <option value="pendiente">Pendiente</option>
          <option value="revision">En revisión</option>
          <option value="resuelto">Resuelto</option>
        </select>
      </div>
    </div>
    <div class="card-pad" id="reclamo-list">
      <div class="empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <p>No hay reclamos registrados. Usa el botón "Nuevo reclamo" para agregar uno.</p>
      </div>
    </div>
  </div>
</div>
